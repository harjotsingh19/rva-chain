version: '3.8'

networks:
  rva_network:
    name: rva-network
# networks:
#   rva_network:
#     driver: bridge

services:
  rva-rpc:
    image: hs60/bsc-chain:latest
    container_name: rva-rpc
    volumes:
      - /home/developer/rva-chain/nodes/rva-rpc:/root/rva-rpc
      - ./rva-rpc.sh:/root/rva-rpc.sh
    working_dir: /root
    environment:
      - NETWORK_PORT=30305
      - HTTP_PORT=8545
    ports:
      - 8545:8545
      - 30305:30305
    entrypoint: [ "sh", "-c", "/root/rva-rpc.sh" ]  
    # network_mode: "host"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30305"]
      interval: 30s
      retries: 5
    networks:
      - rva_network

